name: Finalize Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Tag the approved version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists; nothing to create."
          else
            bunx changeset git-tag
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "refs/tags/$TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; nothing to create."
            exit 0
          fi

          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
